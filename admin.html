<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <title>Phygital Lab CTF Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#07090d; --panel:#101722; --panel2:#172232; --line:rgba(255,255,255,.11); --text:#eff6f6; --muted:#9fb0b5; --cyan:#4dd8ff; --green:#78d56f; --red:#ff6d61; --amber:#f0b64a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { overflow-x:hidden; }
    body { min-height:100vh; background:linear-gradient(135deg,#07090d,#0d1622); color:var(--text); font-family:Syne,system-ui,sans-serif; }
    body::before { content:""; position:fixed; inset:-20%; pointer-events:none; background:radial-gradient(circle at 18% 20%,rgba(77,216,255,.10),transparent 26%),radial-gradient(circle at 82% 18%,rgba(255,109,97,.08),transparent 24%),radial-gradient(circle at 65% 80%,rgba(120,213,111,.08),transparent 25%); animation:adminAmbient 16s ease-in-out infinite alternate; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .login-box,.card,.modal { border:1px solid var(--line); border-radius:8px; background:rgba(16,23,34,.92); box-shadow:0 24px 70px rgba(0,0,0,.35); }
    .login-box { width:min(420px,100%); padding:2rem; animation:adminFloatIn .65s cubic-bezier(.18,.9,.22,1) both; }
    .login-box h1 { font-size:2rem; margin-bottom:.5rem; }
    .login-box p,.muted { color:var(--muted); line-height:1.6; }
    .login-field,.input,textarea,select { width:100%; border:1px solid var(--line); background:#0b111a; color:var(--text); border-radius:6px; padding:.68rem .8rem; font-size:.9rem; outline:none; }
    textarea { min-height:110px; resize:vertical; }
    .login-field { margin:1rem 0; }
    .btn { border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:6px; padding:.58rem .78rem; font-size:.88rem; font-weight:800; transition:transform .18s ease, box-shadow .18s ease, filter .18s ease, border-color .18s ease; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.22); filter:brightness(1.08); }
    .btn.primary { background:var(--cyan); color:#041018; border-color:var(--cyan); }
    .btn.danger { background:rgba(255,109,97,.12); border-color:rgba(255,109,97,.35); color:var(--red); }
    .btn.ok { background:rgba(120,213,111,.12); border-color:rgba(120,213,111,.35); color:var(--green); }
    .err { color:var(--red); min-height:1.3rem; margin-top:.6rem; font-family:"IBM Plex Mono",monospace; font-size:.8rem; }
    #admin-app { display:none; }
    header { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.65rem max(1rem,calc((100vw - 1180px)/2)); background:#fff; color:#111827; border-bottom:1px solid rgba(0,0,0,.12); position:sticky; top:0; z-index:10; animation:adminNav .55s ease both; }
    .brand { display:flex; align-items:center; gap:.8rem; font-weight:900; min-width:0; }
    .brand img { width:240px; max-width:34vw; height:48px; object-fit:contain; object-position:left center; }
    .shell { width:min(1180px,calc(100% - 2rem)); margin:0 auto; padding:1.55rem 0 4rem; }
    .topline { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    .topline h1 { font-size:clamp(2rem,3.6vw,3.25rem); line-height:.98; animation:adminTitle .7s .08s cubic-bezier(.18,.9,.22,1) both; }
    .tabs { display:flex; flex-wrap:wrap; gap:.45rem; overflow:visible; padding-bottom:0; margin-bottom:1rem; }
    .tab { white-space:nowrap; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); border-radius:6px; padding:.5rem .65rem; font-size:.86rem; font-weight:800; transition:transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease; }
    .tab:hover { transform:translateY(-2px); color:var(--text); border-color:rgba(77,216,255,.28); }
    .tab.active { background:var(--cyan); color:#041018; border-color:var(--cyan); }
    .panel { display:none; }
    .panel.active { display:block; animation:panelIn .35s ease both; }
    .grid { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(280px,.92fr); gap:1rem; align-items:start; }
    .card { padding:1rem; margin-bottom:.8rem; min-width:0; transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
    .card:hover { transform:translateY(-3px); border-color:rgba(77,216,255,.22); box-shadow:0 18px 48px rgba(0,0,0,.23); }
    .card h2,.card h3 { margin-bottom:.7rem; font-size:1.15rem; }
    .form-grid { display:grid; grid-template-columns:1fr 160px; gap:.8rem; }
    .full { grid-column:1 / -1; }
    label { display:block; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:.35rem; }
    .actions { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.9rem; }
    header .actions { margin-top:0; justify-content:flex-end; }
    .stats { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
    .pill { border:1px solid var(--line); background:rgba(255,255,255,.04); border-radius:999px; padding:.45rem .7rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:.78rem; }
    .q-card,.student-card { border:1px solid var(--line); background:rgba(255,255,255,.035); border-radius:8px; padding:1rem; margin-bottom:.8rem; overflow-wrap:anywhere; animation:panelIn .35s ease both; transition:transform .2s ease, border-color .2s ease, background .2s ease; }
    .q-card:hover,.student-card:hover { transform:translateY(-3px); border-color:rgba(120,213,111,.24); background:rgba(255,255,255,.055); }
    .q-card-head { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; }
    .q-card h3 { margin:0; font-size:1rem; }
    .q-card p { color:var(--muted); line-height:1.6; margin:.65rem 0; }
    .flag { color:var(--green); font-family:"IBM Plex Mono",monospace; overflow-wrap:anywhere; }
    .hint { color:var(--amber); font-size:.9rem; }
    .modal-wrap { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:30; align-items:center; justify-content:center; padding:1rem; }
    .modal-wrap.open { display:flex; animation:modalShade .2s ease both; }
    .modal { width:min(720px,100%); padding:1.2rem; max-height:90vh; overflow:auto; animation:adminFloatIn .35s cubic-bezier(.18,.9,.22,1) both; }
    .student-grid { display:grid; gap:.8rem; }
    .score-row { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
    #students-card { scroll-margin-top:90px; }
    @media (max-width:960px) {
      .topline { align-items:flex-start; flex-direction:column; }
      .grid { grid-template-columns:1fr; }
    }
    @media (max-width:760px) {
      header { padding:.8rem 1rem; flex-direction:column; align-items:flex-start; }
      .brand img { width:220px; max-width:76vw; }
      .form-grid { grid-template-columns:1fr; }
      .tab { flex:1 1 calc(50% - .45rem); text-align:center; }
      .q-card-head { flex-direction:column; }
    }
    @keyframes adminAmbient { from { transform:translate3d(-1%,-1%,0) rotate(0deg); } to { transform:translate3d(1%,1%,0) rotate(3deg); } }
    @keyframes adminFloatIn { from { opacity:0; transform:translateY(20px) scale(.98); filter:blur(5px); } to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }
    @keyframes adminNav { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes adminTitle { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes panelIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes modalShade { from { opacity:0; } to { opacity:1; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; } }
  </style>
</head>
<body>
  <section id="login-screen">
    <div class="login-box">
      <h1>CTF Admin</h1>
      <p>Manage Phygital Lab CTF questions, flags, hints, points, students, and progress.</p>
      <input class="login-field" type="password" id="login-pass" placeholder="Enter admin password" autocomplete="current-password">
      <button class="btn primary" onclick="doLogin()">Login</button>
      <div class="err" id="login-err"></div>
      <p class="muted">Default password: <code>cdac@admin</code></p>
    </div>
  </section>

  <section id="admin-app">
    <header>
      <a class="brand" href="/index.html">
        <img src="/static/images/cyber-lancers-logo.png" alt="Cyber Lancers logo">
        <span>CTF Admin</span>
      </a>
      <div class="actions">
        <a class="btn" href="/index.html">Back to Site</a>
        <button class="btn danger" onclick="doLogout()">Logout</button>
      </div>
    </header>

    <main class="shell">
      <div class="topline">
        <div>
          <p class="muted">Phygital Lab Challenge Management</p>
          <h1>CTF Questions</h1>
        </div>
        <div class="actions">
          <button class="btn" onclick="renderStudents()">Students</button>
          <button class="btn danger" onclick="resetProgress()">Reset Progress</button>
          <button class="btn danger" onclick="restoreDefaults()">Restore Defaults</button>
          <button class="btn" onclick="exportData()">Export JSON</button>
        </div>
      </div>

      <nav class="tabs" id="tabs"></nav>
      <div id="panels"></div>

      <section class="card" id="students-card" style="display:none">
        <div class="topline">
          <div>
            <h2>Students</h2>
            <p class="muted">Scores and attempts across all Phygital Lab CTF domains.</p>
          </div>
          <button class="btn" onclick="document.getElementById('students-card').style.display='none'">Close</button>
        </div>
        <div class="stats" id="students-stats"></div>
        <div class="student-grid" id="students-list"></div>
      </section>
    </main>
  </section>

  <div class="modal-wrap" id="edit-modal">
    <div class="modal">
      <div class="topline">
        <h2>Edit Challenge</h2>
        <button class="btn" onclick="closeModal()">Close</button>
      </div>
      <input type="hidden" id="edit-id">
      <input type="hidden" id="edit-cat">
      <div class="form-grid">
        <div><label>Title</label><input class="input" id="edit-title"></div>
        <div><label>Points</label><input class="input" type="number" id="edit-points" min="1"></div>
        <div class="full"><label>Description</label><textarea id="edit-desc"></textarea></div>
        <div><label>Flag</label><input class="input" id="edit-flag" spellcheck="false"></div>
        <div><label>Hint</label><input class="input" id="edit-hint"></div>
      </div>
      <div class="actions">
        <button class="btn primary" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/static/js/ctf.js"></script>
  <script>
    const PASS_KEY = "cdac_admin_pass";
    const DEFAULT_PASS = "cdac@admin";
    let domains = [];
    let questions = {};
    let active = "";

    async function api(path, options) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...(options || {}) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.msg || "Request failed");
      return data;
    }

    function getPass() { return localStorage.getItem(PASS_KEY) || DEFAULT_PASS; }
    function doLogin() {
      if (document.getElementById("login-pass").value !== getPass()) {
        document.getElementById("login-err").textContent = "Incorrect password.";
        return;
      }
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-app").style.display = "block";
      init();
    }
    function doLogout() {
      document.getElementById("admin-app").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }
    document.getElementById("login-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

    async function init() {
      const data = await api("/api/admin/challenges");
      domains = data.domains || [];
      questions = data.questions || {};
      active = new URLSearchParams(location.search).get("domain") || domains[0].id;
      renderTabs();
      renderPanels();
      switchDomain(active);
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = domains.map((d) =>
        `<button class="tab" id="tab-${d.id}" onclick="switchDomain('${d.id}')">${escapeHtml(d.title)}</button>`
      ).join("");
    }

    function renderPanels() {
      document.getElementById("panels").innerHTML = domains.map((d) => `
        <section class="panel" id="panel-${d.id}">
          <div class="grid">
            <form class="card" onsubmit="addQuestion(event,'${d.id}')">
              <h2>Add Challenge - ${escapeHtml(d.title)}</h2>
              <div class="form-grid">
                <div><label>Title</label><input class="input" id="${d.id}-title" required></div>
                <div><label>Points</label><input class="input" id="${d.id}-points" type="number" min="1" value="100" required></div>
                <div class="full"><label>Description</label><textarea id="${d.id}-desc" required></textarea></div>
                <div><label>Flag</label><input class="input" id="${d.id}-flag" placeholder="FLAG{...}" spellcheck="false" required></div>
                <div><label>Hint</label><input class="input" id="${d.id}-hint"></div>
              </div>
              <div class="actions">
                <button class="btn primary" type="submit">Add Challenge</button>
                <button class="btn" type="button" onclick="clearForm('${d.id}')">Clear</button>
              </div>
              <div class="err" id="${d.id}-msg"></div>
            </form>
            <div class="card">
              <h2>${escapeHtml(d.title)} Summary</h2>
              <div class="stats" id="${d.id}-stats"></div>
              <p class="muted">Questions added here appear immediately on the student CTF board for this domain.</p>
            </div>
          </div>
          <div id="${d.id}-list"></div>
        </section>
      `).join("");
    }

    function switchDomain(id) {
      active = id;
      domains.forEach((d) => {
        document.getElementById(`tab-${d.id}`).classList.toggle("active", d.id === id);
        document.getElementById(`panel-${d.id}`).classList.toggle("active", d.id === id);
      });
      renderList(id);
    }

    function renderList(id) {
      const list = questions[id] || [];
      const total = list.reduce((sum, q) => sum + Number(q.points || 0), 0);
      document.getElementById(`${id}-stats`).innerHTML = `<span class="pill">${list.length} challenges</span><span class="pill">${total} points</span>`;
      document.getElementById(`${id}-list`).innerHTML = list.length ? list.map((q) => `
        <article class="q-card">
          <div class="q-card-head">
            <div>
              <h3>${escapeHtml(q.title)}</h3>
              <div class="stats"><span class="pill">${q.points} pts</span><span class="pill">${escapeHtml(q.id)}</span></div>
            </div>
            <div class="actions">
              <button class="btn ok" onclick="openEdit('${q.id}','${id}')">Edit</button>
              <button class="btn danger" onclick="deleteQuestion('${q.id}','${id}')">Delete</button>
            </div>
          </div>
          <p>${q.description}</p>
          <div class="flag">Flag: ${escapeHtml(q.flag)}</div>
          ${q.hint ? `<div class="hint">Hint: ${escapeHtml(q.hint)}</div>` : ""}
        </article>
      `).join("") : `<div class="card"><p class="muted">No challenges yet. Add the first one above.</p></div>`;
    }

    async function reloadDomain(id) {
      const data = await api("/api/admin/challenges");
      questions = data.questions || {};
      renderList(id);
    }

    async function addQuestion(event, id) {
      event.preventDefault();
      const payload = getForm(id);
      try {
        await api("/api/admin/challenges", { method: "POST", body: JSON.stringify({ category: id, ...payload }) });
        clearForm(id);
        await reloadDomain(id);
      } catch (e) {
        document.getElementById(`${id}-msg`).textContent = e.message;
      }
    }

    function getForm(id) {
      return {
        title: document.getElementById(`${id}-title`).value.trim(),
        points: Number(document.getElementById(`${id}-points`).value || 0),
        description: document.getElementById(`${id}-desc`).value.trim(),
        flag: document.getElementById(`${id}-flag`).value.trim(),
        hint: document.getElementById(`${id}-hint`).value.trim()
      };
    }

    function clearForm(id) {
      ["title", "desc", "flag", "hint"].forEach((name) => document.getElementById(`${id}-${name}`).value = "");
      document.getElementById(`${id}-points`).value = "100";
      document.getElementById(`${id}-msg`).textContent = "";
    }

    function openEdit(challengeId, category) {
      const q = (questions[category] || []).find((item) => item.id === challengeId);
      if (!q) return;
      document.getElementById("edit-id").value = q.id;
      document.getElementById("edit-cat").value = category;
      document.getElementById("edit-title").value = q.title;
      document.getElementById("edit-points").value = q.points;
      document.getElementById("edit-desc").value = q.description;
      document.getElementById("edit-flag").value = q.flag;
      document.getElementById("edit-hint").value = q.hint || "";
      document.getElementById("edit-modal").classList.add("open");
    }

    function closeModal() { document.getElementById("edit-modal").classList.remove("open"); }

    async function saveEdit() {
      const id = document.getElementById("edit-id").value;
      const category = document.getElementById("edit-cat").value;
      const payload = {
        category,
        title: document.getElementById("edit-title").value.trim(),
        points: Number(document.getElementById("edit-points").value || 0),
        description: document.getElementById("edit-desc").value.trim(),
        flag: document.getElementById("edit-flag").value.trim(),
        hint: document.getElementById("edit-hint").value.trim()
      };
      await api(`/api/admin/challenges/${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(payload) });
      closeModal();
      await reloadDomain(category);
    }

    async function deleteQuestion(id, category) {
      if (!confirm("Delete this challenge?")) return;
      await api(`/api/admin/challenges/${encodeURIComponent(id)}`, { method: "DELETE" });
      await reloadDomain(category);
    }

    async function renderStudents() {
      const data = await api("/api/admin/students");
      const students = data.students || [];
      document.getElementById("students-card").style.display = "block";
      document.getElementById("students-stats").innerHTML = `<span class="pill">${students.length} students</span><span class="pill">${students.reduce((s, st) => s + st.totalSolved, 0)} solves</span>`;
      document.getElementById("students-list").innerHTML = students.length ? students.map((st) => `
        <article class="student-card">
          <h3>${escapeHtml(st.name)}</h3>
          <p class="muted">${escapeHtml(st.email)}</p>
          <div class="score-row">
            <span class="pill">${st.totalScore} total points</span>
            <span class="pill">${st.totalSolved} solved</span>
            <span class="pill">${st.attempts} attempts</span>
          </div>
        </article>
      `).join("") : `<p class="muted">No students yet.</p>`;
    }

    async function resetProgress() {
      if (!confirm("Reset all student progress?")) return;
      await api("/api/admin/reset-progress", { method: "POST", body: "{}" });
      alert("Progress reset.");
    }

    async function restoreDefaults() {
      if (!confirm("Restore default questions for every domain?")) return;
      await api("/api/admin/restore-defaults", { method: "POST", body: "{}" });
      await init();
    }

    async function exportData() {
      const payload = await fetch("/api/admin/export").then((r) => r.json());
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `phygital_ctf_export_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    document.getElementById("edit-modal").addEventListener("click", (e) => { if (e.target.id === "edit-modal") closeModal(); });
  </script>
</body>
</html>
